# Workflow for auto-merging Dependabot PRs
# Uses iobroker-bot-orga/action-automerge-dependabot, which merges via the GitHub API
# according to the rules in .github/auto-merge.yml.
#
# This replaces the previous ahmadnassri/action-dependabot-auto-merge workflow: that one
# worked by posting "@dependabot squash and merge" comments, and GitHub stopped processing
# Dependabot PR comment commands on 2026-01-27.
# https://github.blog/changelog/2025-10-06-upcoming-changes-to-github-dependabot-pull-request-comment-commands/

name: Auto-Merge Dependabot PRs

on:
  # Trigger when a PR is opened or updated
  # WARNING: This needs to be run in the PR base, DO NOT build untrusted code in this action
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run if actor is dependabot
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Rules live in .github/auto-merge.yml (the action's default path)
          merge-method: squash
          # Wait for the test workflow to finish before merging
          wait-for-checks: "true"
